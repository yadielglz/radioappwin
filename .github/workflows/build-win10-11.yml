name: Build RadioApp Studio 26.1124.1500 (Windows 10/11 x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v26.1124.1500*'
    paths:
      - 'v26.1124.1500/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/build-win10-11.yml'

permissions:
  contents: write

jobs:
  build-win10-11:
    name: Windows 10/11 x64 (.NET 8) Build, Test & MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore WiX tool
        run: dotnet tool restore

      - name: Run Unit & DSP Tests
        run: dotnet test v26.1124.1500/RadioApp.Tests/RadioApp.Tests.csproj -c Release --verbosity normal

      - name: Publish Windows 10/11 x64 Application
        shell: pwsh
        run: |
          dotnet publish v26.1124.1500/RadioApp/RadioApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o v26.1124.1500/publish

      - name: Verify Executable
        shell: pwsh
        run: |
          if (!(Test-Path 'v26.1124.1500/publish/RadioApp.exe')) {
            throw 'RadioApp.exe was not produced.'
          }

      - name: Build Windows 10/11 MSI
        shell: pwsh
        working-directory: v26.1124.1500/Installer
        run: |
          dotnet wix build Product.wxs `
            -arch x64 `
            -bindpath . `
            -o ../../RadioApp-26.1124.1500-Win64-Setup.msi

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'v26.1124.1500/publish/*' `
            -DestinationPath 'RadioApp-26.1124.1500-Win64-Portable.zip' `
            -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadioApp-26.1124.1500-Win64
          path: |
            RadioApp-26.1124.1500-Win64-Setup.msi
            RadioApp-26.1124.1500-Win64-Portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v26.1124.1500')
        uses: softprops/action-gh-release@v2
        with:
          name: RadioApp Studio 26.1124.1500 (Windows 10/11 x64)
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            RadioApp-26.1124.1500-Win64-Setup.msi
            RadioApp-26.1124.1500-Win64-Portable.zip
