name: Build RadioApp 4.0.6 for Windows 7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v4.0.6-win7'
    paths:
      - 'recovery/3.58/recovered-source/**'
      - 'web/**'
      - 'windows-7-x64/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/build-win7.yml'

permissions:
  contents: write

jobs:
  build-win7:
    name: Windows 7 SP1 x64 compatibility build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Restore WiX tool
        run: dotnet tool restore

      - name: Publish Windows 7 x64 application
        shell: pwsh
        run: |
          dotnet publish recovery/3.58/recovered-source/RadioApp.csproj `
            -c Release `
            -f net6.0-windows7.0 `
            -r win-x64 `
            --self-contained true `
            -p:RuntimeFrameworkVersion=6.0.36 `
            -o windows-7-x64/publish

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'windows-7-x64/publish/RadioApp.exe')) {
            throw 'RadioApp.exe was not produced.'
          }
          Get-ChildItem 'windows-7-x64/publish' | Select-Object Name, Length

      - name: Build Windows 7 MSI
        shell: pwsh
        working-directory: windows-7-x64/Installer
        run: |
          dotnet wix build Product.wxs `
            -arch x64 `
            -bindpath . `
            -o ../../RadioApp-4.0.6-Windows7-x64.msi

      - name: Verify MSI
        shell: pwsh
        run: |
          if (!(Test-Path 'RadioApp-4.0.6-Windows7-x64.msi')) {
            throw 'Windows 7 MSI was not produced.'
          }
          Get-Item 'RadioApp-4.0.6-Windows7-x64.msi' | Select-Object Name, Length

      - name: Package portable Windows 7 build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'windows-7-x64/publish/*' `
            -DestinationPath 'RadioApp-4.0.6-Windows7-x64.zip' `
            -Force

      - name: Upload Windows 7 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadioApp-4.0.6-Windows7-x64
          path: |
            RadioApp-4.0.6-Windows7-x64.zip
            RadioApp-4.0.6-Windows7-x64.msi
          if-no-files-found: error

      - name: Publish GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RadioApp 4.0.6 - Windows 7 x64
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## RadioApp 4.0.6 - Windows 7 SP1 x64

            Legacy compatibility build for Windows 7 SP1 64-bit.

            Downloads:
            - `RadioApp-4.0.6-Windows7-x64.msi` - recommended installer
            - `RadioApp-4.0.6-Windows7-x64.zip` - portable build

            Runtime: .NET 6.0.36, self-contained.
            The web control room uses HTTP polling fallback when WebSockets are unavailable.

            This legacy build targets an operating system and runtime that are no longer supported by Microsoft.
          files: |
            RadioApp-4.0.6-Windows7-x64.msi
            RadioApp-4.0.6-Windows7-x64.zip

      - name: Publish or update Windows 7 release from main
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Trigger Windows 7 release')
        uses: softprops/action-gh-release@v2
        with:
          name: RadioApp 4.0.6 - Windows 7 x64
          tag_name: v4.0.6-win7
          target_commitish: main
          generate_release_notes: true
          body: |
            ## RadioApp 4.0.6 - Windows 7 SP1 x64

            Legacy compatibility build for Windows 7 SP1 64-bit.

            Downloads:
            - `RadioApp-4.0.6-Windows7-x64.msi` - recommended installer
            - `RadioApp-4.0.6-Windows7-x64.zip` - portable build

            Runtime: .NET 6.0.36, self-contained.
            The web control room uses HTTP polling fallback when WebSockets are unavailable.

            This legacy build targets an operating system and runtime that are no longer supported by Microsoft.
          files: |
            RadioApp-4.0.6-Windows7-x64.msi
            RadioApp-4.0.6-Windows7-x64.zip
