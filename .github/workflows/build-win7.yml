name: Build RadioApp 4.0.6 for Windows 7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v4.0.6-win7'
    paths:
      - 'recovery/3.58/recovered-source/**'
      - 'web/**'
      - 'windows-7-x64/**'
      - '.github/workflows/build-win7.yml'

permissions:
  contents: write

jobs:
  build-win7:
    name: Windows 7 SP1 x64 compatibility build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Publish Windows 7 x64 package
        shell: pwsh
        run: |
          dotnet publish recovery/3.58/recovered-source/RadioApp.csproj `
            -c Release `
            -f net6.0-windows7.0 `
            -r win-x64 `
            --self-contained true `
            -p:RuntimeFrameworkVersion=6.0.36 `
            -o windows-7-x64/publish

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'windows-7-x64/publish/RadioApp.exe')) {
            throw 'RadioApp.exe was not produced.'
          }
          Get-ChildItem 'windows-7-x64/publish' | Select-Object Name, Length

      - name: Package Windows 7 build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'windows-7-x64/publish/*' `
            -DestinationPath 'RadioApp-4.0.6-Windows7-x64.zip' `
            -Force

      - name: Upload Windows 7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioApp-4.0.6-Windows7-x64
          path: RadioApp-4.0.6-Windows7-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RadioApp 4.0.6 - Windows 7 x64
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## RadioApp 4.0.6 - Windows 7 SP1 x64

            Legacy compatibility build for Windows 7 SP1 64-bit.

            - RadioApp version: 4.0.6
            - Target: Windows 7 SP1 x64
            - Runtime: .NET 6.0.36, self-contained
            - Web control room uses HTTP polling fallback when WebSockets are unavailable

            This legacy build targets an operating system and runtime that are no longer supported by Microsoft.
          files: RadioApp-4.0.6-Windows7-x64.zip

      - name: Publish initial Windows 7 release from main
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Trigger Windows 7 release')
        uses: softprops/action-gh-release@v2
        with:
          name: RadioApp 4.0.6 - Windows 7 x64
          tag_name: v4.0.6-win7
          target_commitish: main
          generate_release_notes: true
          body: |
            ## RadioApp 4.0.6 - Windows 7 SP1 x64

            Legacy compatibility build for Windows 7 SP1 64-bit.

            - RadioApp version: 4.0.6
            - Target: Windows 7 SP1 x64
            - Runtime: .NET 6.0.36, self-contained
            - Web control room uses HTTP polling fallback when WebSockets are unavailable

            This legacy build targets an operating system and runtime that are no longer supported by Microsoft.
          files: RadioApp-4.0.6-Windows7-x64.zip
