name: Build and Release RadioApp 5.0

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore recovery/3.58/recovered-source/RadioApp.csproj

      - name: Publish Self-Contained Win-x64 Executable
        run: |
          dotnet publish recovery/3.58/recovered-source/RadioApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o publish/

      - name: Verify Web Directory Exists in Publish Output
        shell: pwsh
        run: |
          if (!(Test-Path "publish/web")) {
            Copy-Item -Path "web" -Destination "publish/web" -Recurse -Force
          }
          Get-ChildItem -Path "publish" -Recurse

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Substring(10) } else { "v5.0.0" }
          Compress-Archive -Path "publish/*" -DestinationPath "RadioApp-$tag-win-x64.zip" -Force
          Write-Host "Created RadioApp-$tag-win-x64.zip"

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: RadioApp ${{ github.ref_name }} Headless Studio
          tag_name: ${{ github.ref_name }}
          body: |
            ## RadioApp 5.0 Headless Broadcast Studio
            
            ### What's New in Version 5.0:
            - **Headless Taskbar Service:** Runs in background with dynamic tray status icon and one-click Web Studio launcher.
            - **Complete Web Studio UI:** Responsive single-deck broadcast deck with real-time waveform, track scrubbing, and VU meters.
            - **Folder & Storage Explorer:** Interactive directory browser supporting local disks, mapped network drives (`Z:\`), and UNC paths.
            - **Gapless Audio & Silence Trimming:** Zero dead air with automated `-42.0 dB` tail cuts and crossfades.
            - **Adaptive Loudness Normalization:** Standardized `-3.0 dB FS` output across songs, sweepers, and station IDs.
            - **Hour Coverage Calculation:** AutoDJ calculates track durations to align the Top-of-Hour Radio ID accurately within tolerance.
            - **Zero-Downtime Migration:** Automatically uses existing `%APPDATA%\RadioApp\settings.json` and `radioapp.db`.
            
            ### Installation:
            1. Download `RadioApp-v5.0.0-win-x64.zip` below.
            2. Extract to your desired folder on the Windows VM.
            3. Launch `RadioApp.exe` (or add a shortcut to your Windows Startup folder).
            4. Double-click the taskbar tray icon or open `http://localhost:5000` in your browser.
          files: |
            RadioApp-*.zip
            publish/RadioApp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
